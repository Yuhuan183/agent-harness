[quality_floor]
policy = "Meet the role quality tier first; optimize the selected secondary objective only within approved routes. `approved_routes` is a curated list, not a measured threshold: the validator tests membership and can never test magnitude, so a rung listed here is approved, not proven above a floor. It was named `allowed` until 2026-07-29, which read as a threshold the code does not implement. `model-routing validate` reports, as warnings, how much of each tier is actually backed by per-rung scores."

[quality_floor.roles]
main = "judgment"
explore = "support"
mech-executor = "support"
executor = "judgment"
plan-verifier = "judgment"
verifier = "critical"
security-reviewer = "critical"
security-executor = "critical"

[quality_floor.approved_routes]
support = ["claude-haiku/low", "claude-sonnet/low", "claude-sonnet/medium", "claude-opus/low"]
judgment = ["claude-sonnet/medium", "claude-opus/low", "claude-opus/medium", "claude-opus/high", "claude-fable/medium", "claude-fable/high", "claude-fable/xhigh"]
critical = ["claude-opus/medium", "claude-opus/high"]

[quality_floor.notes]
judgment_fable = "Fable routes in the judgment tier apply to the main session only (H/X profiles); named roles stay on Opus. Fable stays allowed because it clears the judgment floor comfortably (62.07, second highest published), but as of 2026-08-14 it is dominated by claude-opus/max on index, cost, Briefcase Elo, and output tokens at once, so H/X now names Opus first. Read the domination claim with its caveat: AA's Fable row includes opus-4-8 fallback and no standalone Fable score is published."
xhigh = "xhigh is main-session-only under profile X; no named role or bridge call uses it."
critical_medium = "opus/medium is allowed so verifier can trade depth for speed under fast; security-* stay at opus/high in every profile."
effort_source = "All named roles pin effort from the active deployment preset (user-directed 2026-07-22); no role follows the main-session effort."
tier_separation = "`validate` reports that support and judgment share a measured minimum of 52.46 as of 2026-08-14. That is accurate and expected, not a defect to configure away: both tiers list claude-opus/low, so the two floors coincide at the bottom and the tiers separate by their ceilings and by role assignment, not by their weakest allowed rung. Recorded here so the warning reads as a known shape rather than an unexplained alarm; changing it means removing a rung from a tier, which is a routing decision the user owns."

# Findings `validate` has already been argued out of. Each quotes the warning
# verbatim, so a rung added to a tier or a benchmark refresh that moves 52.46
# stops matching and restores the alarm; an entry matching nothing is an error,
# not a warning. The reasoning lives in the notes above - this only records
# that it was reached.
[[quality_floor.acknowledged_coverage]]
warning = "tiers support and judgment have the same measured minimum (52.46) - they do not separate on evidence"
reason = "see quality_floor.notes.tier_separation: both tiers list claude-opus/low, so the floors coincide by construction and the tiers separate by ceiling and role assignment"

[[quality_floor.acknowledged_coverage]]
warning = "tier support approves 3 route(s) with no per-rung score: claude-haiku/low, claude-sonnet/low, claude-sonnet/medium"
reason = "No per-rung index score is published for these Haiku and Sonnet rungs; the support tier is user-directed (2026-11-10: research priors declared stale, support routes are judged by ledger outcomes)"

[[quality_floor.acknowledged_coverage]]
warning = "tier judgment approves 4 route(s) with no per-rung score: claude-fable/high, claude-fable/medium, claude-fable/xhigh, claude-sonnet/medium"
reason = "AA publishes per-rung scores for neither Fable nor Sonnet; Fable clears the judgment floor on its aggregate and is main-session-only (see quality_floor.notes.judgment_fable)"

