# Claude routing deployment presets, read by main/claude/scripts/model-routing
# and by the experience-ledger scripts through routing_core.
#
# Since 2026-11-10 this file holds routing policy only. The benchmark data and
# research prose it carried were retired when the user declared the research
# stale; route changes come from the user and from ledger outcomes.
version = 1

[selection]
default = "balanced"
fast = "fast"
quality_guarded = "quality_guarded"
high_risk = "quality_guarded"

[route_application.roles]
main = "user_owned_session_selector"
explore = "frontmatter_pin"
mech-executor = "frontmatter_pin"
executor = "frontmatter_pin"
plan-verifier = "frontmatter_pin"
verifier = "frontmatter_pin"
security-reviewer = "frontmatter_pin"
security-executor = "frontmatter_pin"

# Availability per surface. role_frontmatter_override decides whether a
# profile may pin the model on a named role. `configured` means the router
# permits the surface; it does not mean that a smoke test ran.
[models."claude-fable".availability]
subscription = "documented"
main_selector = "configured"
role_frontmatter_override = "not_routed"

[models."claude-opus".availability]
subscription = "documented"
main_selector = "configured"
role_frontmatter_override = "configured"

[models."claude-sonnet".availability]
subscription = "documented"
main_selector = "configured"
role_frontmatter_override = "configured"

[models."claude-haiku".availability]
subscription = "documented"
main_selector = "configured"
role_frontmatter_override = "configured"

[quality_floor]
policy = "Meet the role quality tier first; optimize the selected secondary objective only within approved routes. `approved_routes` is a curated list, not a measured threshold: the validator tests membership only. Since 2026-11-10 no benchmark score backs it; a route enters a tier by user decision, informed by ledger outcomes."

[quality_floor.roles]
main = "judgment"
explore = "support"
mech-executor = "support"
executor = "judgment"
plan-verifier = "judgment"
verifier = "critical"
security-reviewer = "critical"
security-executor = "critical"

[quality_floor.approved_routes]
support = ["claude-haiku/low", "claude-sonnet/low", "claude-sonnet/medium", "claude-opus/low"]
judgment = ["claude-sonnet/medium", "claude-opus/low", "claude-opus/medium", "claude-opus/high", "claude-fable/medium", "claude-fable/high", "claude-fable/xhigh"]
critical = ["claude-opus/medium", "claude-opus/high"]

[quality_floor.notes]
judgment_fable = "Fable routes in the judgment tier apply to the main session only (H/X profiles); named roles stay on Opus."
xhigh = "xhigh is main-session-only under profile X; no named role or bridge call uses it."
critical_medium = "opus/medium is allowed so verifier can trade depth for speed under fast; security-* stay at opus/high in every profile."
effort_source = "All named roles pin effort from the active deployment preset (user-directed 2026-07-22); no role follows the main-session effort."

[profiles.balanced]
description = "Meet every quality floor, then balance capability, speed, cost, and output tokens."

[profiles.balanced.roles.main]
model = "user_selected"
effort = "user_selected"
reason = "The user owns the main-session model and effort; H = Opus/high or Fable/low, X = Opus/high or Fable medium-xhigh."

[profiles.balanced.roles.explore]
model = "claude-haiku"
effort = "low"
reason = "User-directed 2026-11-10: Haiku for reconnaissance once the Sonnet-floor priors were declared stale; findings are re-judged in main and the ledger measures the route."

[profiles.balanced.roles.mech-executor]
model = "claude-opus"
effort = "low"
reason = "User-directed 2026-11-10: Opus at low effort for mechanical work from a complete spec; the stop-on-exception contract carries the quality guard."

[profiles.balanced.roles.executor]
model = "claude-opus"
effort = "medium"
reason = "User-directed 2026-07-23: opus/medium. Escalate to high on the pin's first quality miss."

[profiles.balanced.roles.plan-verifier]
model = "claude-opus"
effort = "medium"
reason = "User-directed: Opus/medium default challenge depth; quality_guarded restores high."

[profiles.balanced.roles.verifier]
model = "claude-opus"
effort = "high"
reason = "Independent adversarial verification keeps a high reasoning floor by default."

[profiles.balanced.roles.security-reviewer]
model = "claude-opus"
effort = "high"
reason = "Security review is a trust-boundary task."

[profiles.balanced.roles.security-executor]
model = "claude-opus"
effort = "high"
reason = "Security implementation preserves the approved high-reasoning floor."

[profiles.fast]
description = "Fastest route among combinations that meet each role's quality floor."

[profiles.fast.roles.explore]
model = "claude-haiku"
effort = "low"
reason = "Fastest eligible route; Haiku since 2026-11-10."

[profiles.fast.roles.mech-executor]
model = "claude-opus"
effort = "low"
reason = "User-directed 2026-11-10: Opus at low effort for mechanical work from a complete spec; the stop-on-exception contract carries the quality guard."

[profiles.fast.roles.executor]
model = "claude-opus"
effort = "low"
reason = "User-directed: Opus capability at low effort trades reasoning depth for wall-clock."

[profiles.fast.roles.plan-verifier]
model = "claude-opus"
effort = "medium"
reason = "User-directed: medium challenge depth under time pressure."

[profiles.fast.roles.verifier]
model = "claude-opus"
effort = "medium"
reason = "User-directed: medium keeps the gate independent while shortening verification wall-clock."

[profiles.fast.roles.security-reviewer]
model = "claude-opus"
effort = "high"
reason = "Speed preference does not lower security review depth."

[profiles.fast.roles.security-executor]
model = "claude-opus"
effort = "high"
reason = "Speed preference does not lower security implementation depth."

[profiles.quality_guarded]
description = "Guard high-risk, high-impact, or ambiguity-heavy work without overspending on bounded support roles."

[profiles.quality_guarded.roles.main]
model = "user_selected"
effort = "user_selected"
reason = "Recommend profile X (Opus/high, or Fable up to xhigh); the user still owns the switch."

[profiles.quality_guarded.roles.explore]
model = "claude-sonnet"
effort = "medium"
reason = "User-directed: deeper evidence coverage for high-stakes work; exploration still cannot decide or implement."

[profiles.quality_guarded.roles.mech-executor]
model = "claude-opus"
effort = "low"
reason = "User-directed 2026-11-10: Opus at low effort for mechanical work from a complete spec; the stop-on-exception contract carries the quality guard. opus/low is the support tier's highest approved route."

[profiles.quality_guarded.roles.executor]
model = "claude-opus"
effort = "high"
reason = "User-directed 2026-07-23: opus/high keeps the fast/balanced/quality_guarded executor ladder monotone (low/medium/high)."

[profiles.quality_guarded.roles.plan-verifier]
model = "claude-opus"
effort = "high"
reason = "Material plans receive adversarial high-effort review."

[profiles.quality_guarded.roles.verifier]
model = "claude-opus"
effort = "high"
reason = "Independent verification remains high effort."

[profiles.quality_guarded.roles.security-reviewer]
model = "claude-opus"
effort = "high"
reason = "Security review remains high effort."

[profiles.quality_guarded.roles.security-executor]
model = "claude-opus"
effort = "high"
reason = "Security implementation remains high effort."

[revision_policy]
days = 90
min_samples = 10
half_life_days = 45.0
prefer_probability = 0.9
cohort_fields = ["role", "task_class"]
excluded_task_classes = ["smoke", "other"]
