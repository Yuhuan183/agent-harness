version = 1
as_of = "2026-07-26"
benchmark = "Artificial Analysis Intelligence Index v4.1"
secondary_benchmark = "AA-Briefcase Elo (agentic knowledge-work benchmark). Recorded per model because it discriminates far harder than the text index on exactly the work this harness dispatches: claude-opus-5 1720 / claude-fable-5 1574 / claude-sonnet-5 1386 / claude-opus-4-8 1346 / claude-haiku-4-5 612 (Haiku last confirmed 2026-07-25). The 7-point text-index gap between Opus 5 and Sonnet 5 is a 335-Elo gap here. From 2026-07-26 AA also publishes it per effort rung, which is the first per-rung evidence this config has ever had for Sonnet: opus 1223/1470/1606/1693/1720 and sonnet 928/1056/1194/1294/1386 across low/medium/high/xhigh/max. The two ladders interleave - claude-opus-5/low (1223) outranks claude-sonnet-5/high (1194) - see effort_curve for what that does and does not license."
metric_scope = "English text benchmark prior; not local coding-agent success rate"
availability_scope = "Per-surface status; benchmark data is retained even when a dispatch override is unverified"
availability_semantics = "configured means router-permitted, not necessarily smoke-tested; evidence records verification level"
evidence_caveat = "Scores are English-text benchmark priors for model ranking, not local coding-agent success rates; revision_policy still requires n>=10 per role/task_class route cell before local evidence moves a route. Coverage as of 2026-07-26: the Opus ladder is fully measured on the text index (low through max) after AA published claude-opus-5/low at 50.61, closing the last gap noted on 07-25. Sonnet still has no per-rung index score - every Sonnet rung remains bounded from above by 53.35 on that axis - but it now has a per-rung Briefcase Elo, so the support pins are no longer evidence-free; they are measured on the agentic axis and unmeasured on the text axis."
effort_curve = "claude-opus-5 measured per-effort index (AA v4.1, 2026-07-26): low 50.61 @ $0.361/task, medium 56.28 @ $0.618, high 58.86 @ $1.057, xhigh 60.07 @ $1.561, max 60.69 @ $2.028. Three consequences drive the routes below. (1) opus/medium (56.28) exceeds the previous generation's ceiling, claude-opus-4-8/max (55.69), at about a third of its cost, and exceeds claude-sonnet-5/max (53.35) at 40% of that cost, so no Sonnet rung can outrank opus/medium on capability. (2) The ladder is monotone and its steps are unequal - low to medium buys 5.7 index points for $0.26, xhigh to max buys 0.6 for $0.47 - which is why no profile pins max. (3) New on 07-26 and deliberately not acted on: per-rung Briefcase Elo puts claude-opus-5/low (1223) above claude-sonnet-5/high (1194), so the support pins sonnet/low (928) and sonnet/medium (1056) sit 295 and 166 Elo below a rung the support tier already allows. That is a candidate, not a verdict - AA publishes no per-rung cost for any Sonnet effort, so the price of the swap is unquantified while Sonnet's token price is 2.5x lower ($2/$10 vs $5/$25); the Sonnet floor was user-directed; and revision_policy still wants n>=10 local samples per cell."
superseded_prior = "The BrowseComp agentic-search curve (community-shared chart, 2026-07) that previously justified the executor ladder is retired: it was measured on claude-opus-4-8 and claude-sonnet-5, and AA's own per-effort index now covers the Opus ladder directly. Retained in docs/harness-engineering-research.md as history, not as an active prior."
generation_note = "2026-07-25: the opus frontmatter alias resolves to claude-opus-5. Leaf pins kept their effort rungs across the generation move; the per-effort data since retrieved confirms the move was strictly favourable (opus/medium now outranks opus-4-8/max at a third of the cost). Sonnet support pins remain untouched - as of 2026-07-26 that is no longer for want of data but for want of a priced comparison and local samples; see effort_curve."
data_verification = "Re-retrieved from AA 2026-07-26 by parsing each variant page's application/ld+json Dataset blocks, then unioned across all 32 fetched pages because a single page truncates every chart to its top rows; 0 conflicts on the overlap. Cost per index task is the sum of the five published components (input, cacheHit, cacheWrite, reasoning, answer) and agrees with AA's own published total to full float precision wherever both exist. Changes against the 2026-07-25 snapshot are Claude-side only: claude-opus-5/low gained an index score (50.61), high and xhigh gained a cost per task, max gained its output-token split, and per-rung Briefcase Elo appeared for both claude-opus-5 and claude-sonnet-5. Index scores that already existed did not move. Decode minutes moved fractionally on the Opus rungs (AA re-measures speed continuously) and are updated below."

