version = 1
as_of = "2026-08-14"
prior_review_days = 90
prior_review = "Re-fetch and re-audit these AA priors when any routed model ships a new generation or effort rung, or 90 days after as_of, whichever comes first; a review that finds no change updates as_of and this note rather than letting the prior silently age. This is the benchmark-prior cadence - local ledger evidence still moves routes under revision_policy on its own schedule."
benchmark = "Artificial Analysis Intelligence Index v4.1.1"
secondary_benchmark = "AA-Briefcase Elo (agentic knowledge-work benchmark). Recorded per model because it discriminates far harder than the text index on exactly the work this harness dispatches: claude-opus-5 1715 / claude-fable-5 1574 / claude-sonnet-5 1383 / claude-opus-4-8 1340 / claude-haiku-4-5 612. The 8-point text-index gap between Opus 5 and Sonnet 5 is a 332-Elo gap here. Per effort rung: opus 1225/1469/1606/1690/1715 and sonnet 931/1057/1193/1292/1383 across low/medium/high/xhigh/max. The two ladders interleave - claude-opus-5/low (1225) outranks claude-sonnet-5/high (1193) - see effort_curve for what that does and does not license. Briefcase sits outside the Intelligence Index, so unlike every score in this file it stays comparable across the v4.1 to v4.1.1 change: no rung moved more than 6 Elo between 2026-07-26 and 2026-08-14, which is why the index shift is read as a scale change rather than a model change."
metric_scope = "English text benchmark prior; not local coding-agent success rate"
context_window_note = "Measured 2026-08-06 from proxy beta headers, not inferred: a leaf pinned to the `opus` alias already runs on the 1M window, and one pinned to `sonnet` runs on 200k. `claude-sonnet-5[1m]` is accepted in frontmatter and does take effect, so moving the support pins up is possible - it is just not needed, since this repo's own explore sits at a 4.3 KB median read while the sonnet p95 belongs to Claude Code's built-in agents. docs/research/model-evidence.md has the method and the truth table."
availability_scope = "Per-surface status; benchmark data is retained even when a dispatch override is unverified"
availability_semantics = "configured means router-permitted, not necessarily smoke-tested; evidence records verification level"
evidence_caveat = "English-text benchmark prior, not a local coding-agent success rate; local ledger evidence needs n>=10 in a role/task_class before it moves a route. Coverage as of 2026-08-14: the Opus ladder is fully measured on the text index, low through max. Sonnet still has no per-rung index score - every Sonnet rung stays bounded above by 55.26 on that axis - but it does have per-rung Briefcase Elo, so support pins are no longer evidence-free: they are measured on the agentic axis and unmeasured on the text axis. New with v4.1.1: three of the nine evaluations in the index (HLE, AA-LCR, AA-Omniscience) are graded by GPT-5.6 Luna (medium), so the text index is no longer independent of a vendor that also appears in it."
effort_curve = "claude-opus-5 measured per-effort index (AA v4.1.1, 2026-08-14): low 52.46 @ $0.425/task, medium 58.64 @ $0.724, high 61.48 @ $1.227, xhigh 62.52 @ $1.801, max 63.05 @ $2.337. Three consequences drive the routes below. (1) opus/medium (58.64) exceeds the previous generation's ceiling, claude-opus-4-8/max (57.33), at about a third of the cost, and exceeds claude-sonnet-5/max (55.26) at under half the cost, so no Sonnet rung can outrank opus/medium on capability. (2) The ladder is monotone but its steps are very unequal - low to medium buys 6.18 index points for $0.30, xhigh to max buys 0.53 for $0.54, a 21x difference in cost per point - which is why no profile pins max. (3) Carried forward from 2026-07-26 and still deliberately not acted on: per-rung Briefcase Elo puts claude-opus-5/low (1225) above claude-sonnet-5/high (1193), so the support pins sonnet/low (931) and sonnet/medium (1057) sit 294 and 168 Elo below a rung the support tier already allows. That is a candidate, not a verdict - AA still publishes no per-rung cost for any Sonnet effort, so the price of the swap stays unquantified while Sonnet's token price is 2.5x lower ($2/$10 vs $5/$25), and the Sonnet floor is user-directed. Local sampling on 2026-08-04 and 2026-08-06, 6 claude-opus-5/low against 6 claude-sonnet-5/low, did not transfer the gap; see support_pin_evidence."
superseded_prior = "The BrowseComp agentic-search curve (community-shared chart, 2026-07) that previously justified the executor ladder is retired: it was measured on claude-opus-4-8 and claude-sonnet-5, and AA's own per-effort index now covers the Opus ladder directly. Retained in docs/research/model-evidence.md as history, not as an active prior."
generation_note = "2026-07-25: the opus frontmatter alias resolves to claude-opus-5. Leaf pins kept their effort rungs across the generation move; the per-effort data since retrieved confirms the move was strictly favourable (opus/medium now outranks opus-4-8/max at a third of the cost). Sonnet support pins remain untouched - as of 2026-07-26 that is no longer for want of data but for want of a priced comparison; see effort_curve and support_pin_evidence."
support_pin_evidence = "What decides the support pins. Restated 2026-08-06 after the cell was finally sampled; the 2026-08-04 version of this note was right that no *profile* path samples it and wrong that no path does. (1) The deciding reasons were the user-directed Sonnet floor and the missing per-rung Sonnet price. (2) revision_policy's n>=10 was never reachable through route_application: every leaf role is pinned by frontmatter and no profile lists claude-opus-5/low for a support role. (3) But the Claude Agent tool takes a per-dispatch `model` override that outranks the frontmatter pin, so the cell is samplable after all - effort is not overridable this way, which is why this samples the model axis only. Logging one needs an explicit `experience-log --model`: the route guard compares the pin against the hook-recorded observed_model and refuses the record as a routing violation otherwise. (4) Measured 2026-08-06 on the s10 fixture, 6 samples at claude-opus-5/low against 6 at claude-sonnet-5/low, route confirmed per dispatch from observed_model: arm A 3/3 clean on both rungs (ceiling, separates nothing); arm D 3/3 clean on sonnet/low and 2/3 on opus/low, the third raising R2-overtriggered-critical x3. opus/low was also slower (arm D median 37.1s vs 30.6s). The 294-Elo per-rung gap therefore did not transfer to this task at n=6, and the one observed failure sits on the higher rung. (5) Standing decision: support pins stay on Sonnet. This is now a measured hold rather than an unevidenced one, but n=6 is below the floor and one fixture is not the role - treat it as a refuted expectation, not a proven ranking. (6) What would overturn it: a support-role failure in real recon work, or a per-rung Sonnet price that makes the comparison decidable on cost."
unsampled_role_evidence = "Three pins are held by contract, not by data, and that is accepted rather than pending (user-directed 2026-08-06). Measured over the 30 days to that date, delegation-report counted 286 subagent launches: executor 98, explore 33, verifier 23, mech-executor 20 - and plan-verifier 0, security-reviewer 0, security-executor 1. At that rate revision_policy's n>=10 is not reachable for the last three in any horizon the 90-day window covers, so waiting for it would leave them permanently marked as unevidenced gaps in every review. What justifies them instead: the role has to exist with the right authority and tool set at the moment a trigger fires, and its effort comes from quality_floor's critical tier, which is a floor argument rather than an outcome claim. Read a zero here as 'never needed yet', not as 'never measured'. What would move them: a sustained dispatch rate that makes the cohort samplable, or a single failure in one of the rare real dispatches, which at n=1 would be worth more than the silence is."
data_verification = "Re-retrieved 2026-08-14 by parsing each variant page's application/ld+json Dataset blocks and unioning across all fetched pages, because a single page truncates every chart to its top rows. Cost per index task is the sum of the five published components (input, cacheHit, cacheWrite, reasoning, answer); AA publishes both the components and its own total on only two cells this round, claude-opus-5/medium and /low, and the two agree exactly there - every other cell carries AA's published total unverified. One extraction hazard found and worked around: AA gives both Haiku 4.5 variants the label 'Claude 4.5 Haiku', so a page union silently overwrites one with the other across a 5.75-point gap; that row is taken from each slug's own line instead, and its score_note says which figure came from which variant. This refresh crosses an index version: AA moved v4.1 to v4.1.1 (tau3-Banking rebased on upstream tau2-bench v1.0.1; HLE, AA-LCR and AA-Omniscience regraded by GPT-5.6 Luna (medium)), so every score, cost and token count here was recomputed by AA and must not be compared with the 2026-07-26 values it replaces. Briefcase Elo sits outside the index and moved at most 6 Elo on any rung, which is the reason to read the index shift as a scale change. Three values could not be refreshed because AA no longer publishes those cells, and remain v4.1-era: claude-opus-4-8 total_eval_cost_usd and output_tokens_per_index_task, and claude-sonnet-5 output_tokens_per_index_task."

