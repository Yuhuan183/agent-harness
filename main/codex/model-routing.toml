version = 3
as_of = "2026-07-26"
benchmark = "Artificial Analysis Intelligence Index v4.1"
data_verification = "Re-retrieved from AA 2026-07-26 and compared cell by cell against the 2026-07-25 and 2026-07-21 snapshots. This pass is strictly stronger than 07-25: the union across all 32 fetched variant pages recovered an index score for all 15 GPT-5.6 rungs, not only the 7 AA charts on a single page. Every eval-derived figure held - index to 4 decimals and cost per index task, reasoning tokens and answer tokens to 5 decimals, on all 15 rungs, 60 of 60 comparisons. Decode minutes did move on all 15, by -6.5% (sol/max) to +22% (luna/xhigh), and are updated below: that field is a continuously re-measured throughput observation, not a fixed eval result, so it drifts while the scores do not. Any speed-based reasoning quoting a 07-21 or 07-25 decode figure should be recomputed. Method: parse each variant page's application/ld+json Dataset blocks and union across pages, because a single page truncates every chart to its top rows; cost per task is the sum of the five published components and agrees with AA's own total to full float precision."
secondary_benchmark = "AA-Briefcase Elo (agentic knowledge-work benchmark), published for gpt-5.6-sol only: 1503.38 at max. Cross-provider caution - the text index puts sol/max within 1.8 points of claude-opus-5/max (58.89 vs 60.69), but Briefcase puts it 217 Elo behind (1503 vs 1720). On agentic work the providers are not as close as the index implies; CP-first routing should not treat sol/max as an Opus-5-equivalent."
metric_scope = "English text benchmark prior; not local coding-agent success rate"
availability_scope = "Per-surface status; benchmark data is retained even when a dispatch override is unverified"
availability_semantics = "configured means router-permitted, not necessarily smoke-tested; evidence records verification level"
effort_ladder_scope = "GPT-5.6 accepts none/low/medium/high/xhigh/max; this table defines low through max because those are the rungs a role can be routed to. The `none` rung is measured and deliberately excluded: AA puts non-reasoning at 41.20 (sol), 33.97 (terra) and 26.56 (luna), all below the support floor, so admitting it to the schema would add a rung no route could ever select. Figures are kept in docs/harness-engineering-research.md as the measured floor of the ladder."
model_guidance_source = "OpenAI GPT-5.6 model guidance (https://developers.openai.com/api/docs/guides/prompt-guidance-gpt-5p6, read 2026-07-26): medium is the balanced starting point, low suits latency-sensitive work, high/xhigh only where extra reasoning shows a measured quality gain, and max is reserved for the hardest quality-first workloads and should be benchmarked against xhigh rather than assumed better. The profiles below already follow that shape and pin no role above high; `max` stays a data row. `reasoning.mode: 'pro'` is orthogonal to effort and is not routed here - the Codex CLI surface this bundle dispatches through does not expose it."

[selection]
default = "balanced"
fast = "fast"
quality_guarded = "quality_guarded"
high_risk = "quality_guarded"

[route_application.roles]
main = "session_start_recommendation"
explore = "dispatch_override"
mech-executor = "dispatch_override"
executor = "dispatch_override"
plan-verifier = "dispatch_override"
verifier = "dispatch_override"
security-reviewer = "dispatch_override"
security-executor = "dispatch_override"

