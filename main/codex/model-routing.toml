version = 3
as_of = "2026-08-14"
prior_review_days = 90
prior_review = "Re-fetch and re-audit these AA priors when GPT-5.6 or any routed model ships a new generation or effort rung, or 90 days after as_of, whichever comes first; a review that finds no change updates as_of and this note rather than letting the prior silently age. This is the benchmark-prior cadence - local ledger evidence still moves routes under revision_policy on its own schedule."
benchmark = "Artificial Analysis Intelligence Index v4.1.1"
data_verification = "Re-retrieved 2026-08-14 by parsing each variant page's application/ld+json Dataset blocks and unioning across pages, because a single page truncates every chart to its top rows. Figures are AA's own published per-rung values; the five-component cost sum was not re-derived for the GPT rungs this round, so cost per index task here is taken as published rather than recomputed. This refresh crosses an index version: AA moved v4.1 to v4.1.1 (tau3-Banking rebased on upstream tau2-bench v1.0.1; HLE, AA-LCR and AA-Omniscience regraded by GPT-5.6 Luna (medium)), so every score, cost and token count on all 15 rungs was recomputed by AA. The 2026-07-26 cell-by-cell zero-drift check does not carry across the bump and was not repeated; figures here replace rather than confirm the previous snapshot. Two consequences for reading this table: scores moved up roughly 1 to 3 points on every rung and that is a scale change, not a model change; and stored precision is now normalised to the Claude table's convention (score 2dp, cost 3dp, tokens 1dp) instead of the 4 to 5 decimals carried before. Decode minutes remain a continuously re-measured throughput observation rather than a fixed eval result, so any speed-based reasoning quoting an older decode figure should be recomputed."
secondary_benchmark = "AA-Briefcase Elo (agentic knowledge-work benchmark), published for gpt-5.6-sol only: 1503.58 at max. Cross-provider caution - the text index puts sol/max within 2.12 points of claude-opus-5/max (60.93 vs 63.05), but Briefcase puts it 211 Elo behind (1504 vs 1715). On agentic work the two providers are not as close as the index implies, so CP-first routing should not treat sol/max as Opus-5-equivalent. The gap held across the v4.1 to v4.1.1 index change (it was 217 Elo on 2026-07-26), and Briefcase is outside the index, so this comparison is the one figure here that survives the version bump."
metric_scope = "English text benchmark prior; not local coding-agent success rate"
availability_scope = "Per-surface status; benchmark data is retained even when a dispatch override is unverified"
availability_semantics = "configured means router-permitted, not necessarily smoke-tested; evidence records verification level"
effort_ladder_scope = "GPT-5.6 accepts none/low/medium/high/xhigh/max; this table defines low through max because those are the rungs a role can be routed to. The `none` rung is measured and deliberately excluded: AA puts non-reasoning at 41.88 (sol), 34.62 (terra) and 26.84 (luna), all below the support floor, so admitting it to the schema would add a rung no route could ever select. Figures are kept in docs/research/model-evidence.md as the measured floor of the ladder."
model_guidance_source = "OpenAI GPT-5.6 model guidance (https://developers.openai.com/api/docs/guides/prompt-guidance-gpt-5p6, read 2026-07-26): medium is the balanced starting point, low suits latency-sensitive work, high/xhigh only where extra reasoning shows a measured quality gain, and max is reserved for the hardest quality-first workloads and should be benchmarked against xhigh rather than assumed better. The profiles below already follow that shape and pin no role above high; `max` stays a data row. `reasoning.mode: 'pro'` is orthogonal to effort and is not routed here - the Codex CLI surface this bundle dispatches through does not expose it."

[selection]
default = "balanced"
fast = "fast"
quality_guarded = "quality_guarded"
high_risk = "quality_guarded"

[route_application.roles]
main = "session_start_recommendation"
explore = "dispatch_override"
mech-executor = "dispatch_override"
executor = "dispatch_override"
plan-verifier = "dispatch_override"
verifier = "dispatch_override"
security-reviewer = "dispatch_override"
security-executor = "dispatch_override"

