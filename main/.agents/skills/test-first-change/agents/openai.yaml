interface:
  display_name: "Test First Change"
  short_description: "Change behaviour behind a check that was seen to fail"
  default_prompt: "Use $test-first-change to add or change behaviour behind a check you have watched fail."
policy:
  # Explicit-only for the first release, per the distillation plan: the M1 cells
  # price behaviour once invoked, not whether invocation fires on the right asks.
  # Nothing here bounds a false positive yet, so the plan's own rule applies.
  # Revisit once description discrimination has been measured.
  allow_implicit_invocation: false
