[quality_floor]
policy = "Meet the role quality tier first; optimize the selected secondary objective only within allowed routes."

[quality_floor.roles]
main = "judgment"
explore = "support"
mech-executor = "support"
executor = "judgment"
plan-verifier = "judgment"
verifier = "critical"
security-reviewer = "critical"
security-executor = "critical"

[quality_floor.allowed]
support = ["claude-sonnet-5/low", "claude-sonnet-5/medium", "claude-opus-5/low"]
judgment = ["claude-sonnet-5/medium", "claude-opus-5/low", "claude-opus-5/medium", "claude-opus-5/high", "claude-fable-5/medium", "claude-fable-5/high", "claude-fable-5/xhigh"]
critical = ["claude-opus-5/medium", "claude-opus-5/high"]

[quality_floor.notes]
judgment_fable = "Fable routes in the judgment tier apply to the main session only (H/X profiles); named roles stay on Opus. Fable stays allowed because it clears the judgment floor comfortably (59.86, second highest published), but as of 2026-07-25 it is dominated by claude-opus-5/max on index, cost, Briefcase Elo, and output tokens at once, so H/X now names Opus first. Read the domination claim with its caveat: AA's Fable row includes opus-4-8 fallback and no standalone Fable score is published."
xhigh = "xhigh is main-session-only under profile X; no named role or bridge call uses it."
critical_medium = "opus/medium is allowed so verifier can trade depth for speed under fast; security-* stay at opus/high in every profile."
effort_source = "All named roles pin effort from the active deployment preset (user-directed 2026-07-22); no role follows the main-session effort."

[profiles.balanced]
description = "Meet every quality floor, then balance capability, speed, cost, and output tokens."

[profiles.balanced.roles.main]
model = "user_selected"
effort = "user_selected"
reason = "The user owns the main-session model and effort; H = Opus/high or Fable/low, X = Opus/high or Fable medium-xhigh. Opus 5 leads both profiles on 2026-07-25 measured data (higher index and Briefcase Elo at lower cost per task than Fable 5)."

[profiles.balanced.roles.explore]
model = "claude-sonnet-5"
effort = "low"
reason = "User-directed Sonnet floor for reconnaissance quality; low effort because findings are re-judged in main."

[profiles.balanced.roles.mech-executor]
