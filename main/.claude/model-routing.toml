version = 1
as_of = "2026-07-25"
benchmark = "Artificial Analysis Intelligence Index v4.1"
secondary_benchmark = "AA-Briefcase Elo (agentic knowledge-work benchmark). Recorded per model because it discriminates far harder than the text index on exactly the work this harness dispatches: claude-opus-5 1720 / claude-fable-5 1574 / claude-sonnet-5 1386 / claude-opus-4-8 1346 / claude-haiku-4-5 612. The 7-point text-index gap between Opus 5 and Sonnet 5 is a 335-Elo gap here."
metric_scope = "English text benchmark prior; not local coding-agent success rate"
availability_scope = "Per-surface status; benchmark data is retained even when a dispatch override is unverified"
availability_semantics = "configured means router-permitted, not necessarily smoke-tested; evidence records verification level"
evidence_caveat = "Scores are English-text benchmark priors for model ranking, not local coding-agent success rates; revision_policy still requires n>=10 per role/task_class route cell before local evidence moves a route. Coverage as of 2026-07-25 is no longer uniform: AA publishes per-effort index scores for claude-opus-5 (medium/high/xhigh/max) and the GPT-5.6 family, so the Opus effort ladder is now measured rather than inferred. Two gaps remain - claude-opus-5/low has published cost and token data but no index score, and claude-sonnet-5 is still published at max effort only, so every Sonnet rung is bounded from above by 53.35 and otherwise unmeasured."
effort_curve = "claude-opus-5 measured per-effort index (AA v4.1, 2026-07-25): medium 56.28 @ $0.618/task, high 58.86, xhigh 60.07, max 60.69 @ $2.028/task; low is $0.361/task with no published score. Two consequences drive the routes below: opus/medium (56.28) already exceeds the previous generation's ceiling, claude-opus-4-8/max (55.69), at about a third of its cost; and it exceeds claude-sonnet-5/max (53.35) at 40% of that cost, so no Sonnet rung can outrank opus/medium on capability."
superseded_prior = "The BrowseComp agentic-search curve (community-shared chart, 2026-07) that previously justified the executor ladder is retired: it was measured on claude-opus-4-8 and claude-sonnet-5, and AA's own per-effort index now covers the Opus ladder directly. Retained in docs/harness-engineering-research.md as history, not as an active prior."
generation_note = "2026-07-25: the opus frontmatter alias resolves to claude-opus-5. Leaf pins kept their effort rungs across the generation move; the per-effort data since retrieved confirms the move was strictly favourable (opus/medium now outranks opus-4-8/max at a third of the cost). Sonnet support pins remain untouched for want of per-effort Sonnet data, not for want of a candidate - see effort_curve."

